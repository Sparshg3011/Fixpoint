[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixpoint"
version = "0.1.0"
description = "A SWE-bench coding agent: locate the code, write a patch, run the tests, replan until green."
requires-python = ">=3.10"
dependencies = [
    # HF loader for SWE-bench_Lite; pinned so the dataset fingerprint check
    # in fixpoint.bench.loader stays meaningful across machines.
    "datasets==5.0.0",
    # The official grading harness. Pinned hard: its eval semantics ARE the
    # headline metric, and a silent upgrade could change what "resolved" means.
    "swebench==4.1.0",
    # Anthropic SDK for the patcher and reproducer model calls. Floor only —
    # the Messages API surface we use (messages.create, content blocks, usage
    # token counts) has been stable across SDK releases.
    "anthropic>=0.40",
    # The streaming LLM client calls httpx directly (see agent/llm.py) — it
    # arrives via other deps today, but an implicit dependency is a time bomb.
    "httpx>=0.27",
    # The web backend. uvicorn runs it; both are real runtime deps of
    # `python -m fixpoint.server`, not dev conveniences.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # GitHub App identity for the PR flow: RS256-signed app JWTs exchanged for
    # short-lived installation tokens. [crypto] pulls in `cryptography`.
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
# pip install -e ".[dev]" — the hermetic test suite (no network, Docker, or API).
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fixpoint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Pinned EXPLICITLY rather than relying on ruff's defaults: CI installs ruff
# unpinned, and a release that widens the default rule set would otherwise turn
# a green build red without a line of our code changing.
#   E4/E7/E9,F  pyflakes + the pycodestyle checks worth enforcing
#   I           import sorting
#   UP          pyupgrade — keep syntax current for the target Python
# E501 (line length) is deliberately off; several explanatory comments run long.
select = ["E4", "E7", "E9", "F", "I", "UP"]
