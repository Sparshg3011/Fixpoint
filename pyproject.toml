[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixpoint"
version = "0.1.0"
description = "A SWE-bench coding agent: locate the code, write a patch, run the tests, replan until green."
requires-python = ">=3.10"
dependencies = [
    # HF loader for SWE-bench_Lite; pinned so the dataset fingerprint check
    # in fixpoint.bench.loader stays meaningful across machines.
    "datasets==5.0.0",
    # The official grading harness. Pinned hard: its eval semantics ARE the
    # headline metric, and a silent upgrade could change what "resolved" means.
    "swebench==4.1.0",
    # Anthropic SDK for the patcher and reproducer model calls. Floor only —
    # the Messages API surface we use (messages.create, content blocks, usage
    # token counts) has been stable across SDK releases.
    "anthropic>=0.40",
]

[project.optional-dependencies]
# pip install -e ".[dev]" — the hermetic test suite (no network, Docker, or API).
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fixpoint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import sorting. Deliberately not enabling line-length
# (E501) — several explanatory comments run long on purpose.
extend-select = ["I"]
